<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1520"/>
      <stop offset="100%" stop-color="#05080d"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#00b347"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0080ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Cyber Shield -->
  <path d="M32 4 L54 12 V28 C54 44 32 58 32 58 C32 58 10 44 10 28 V12 Z" 
        fill="url(#shieldGrad)" 
        stroke="#00ff66" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Inner Tech Accent Lines -->
  <path d="M32 8 L49 14.5 V27 C49 39.5 32 51.5 32 51.5 C32 51.5 15 39.5 15 27 V14.5 Z" 
        fill="none" 
        stroke="#00f0ff" 
        stroke-width="1" 
        stroke-dasharray="3,2" 
        opacity="0.6"/>

  <!-- Central Padlock / Terminal Symbol -->
  <!-- Lock Shackle -->
  <path d="M25 26 V21 C25 17.1 28.1 14 32 14 C35.9 14 39 17.1 39 21 V26" 
        fill="none" 
        stroke="url(#cyanGlow)" 
        stroke-width="3" 
        stroke-linecap="round"/>

  <!-- Lock Body -->
  <rect x="23" y="26" width="18" height="15" rx="3" 
        fill="#080e14" 
        stroke="url(#greenGlow)" 
        stroke-width="2" 
        filter="url(#glow)"/>

  <!-- Keyhole / Terminal Cursor Symbol -->
  <circle cx="32" cy="32" r="2" fill="#00ff66"/>
  <path d="M32 33.5 V37.5" stroke="#00ff66" stroke-width="2" stroke-linecap="round"/>
</svg>
